[package]
name = "nostos"
version = "0.1.0"
license-file = "LICENSE"
documentation = "https://docs.rs/nostos"
homepage = "https://github.com/benferse/nostos"
repository = "https://github.com/benferse/nostos"
edition = "2024"
rust-version = "1.95"
authors = ["Ben"]
autolib = false
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Welcome home, hero"
categories = ["command-line-utilities"]

[lib]
name = "nostos"
path = "src/lib.rs"

[[bin]]
name = "nostos"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "workflows"
path = "tests/workflows.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
